name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Pre-install tryscript
        run: npm install -g tryscript@latest
      - uses: astral-sh/setup-uv@v7
      - name: Install Python flowmark for parity tests
        run: uv tool install flowmark==0.6.4
      - name: Build flowmark binary for tests
        run: cargo build --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run tests before publishing
        run: cargo test --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Publish to crates.io
        run: |
          # Exchange GitHub OIDC token for crates.io publish token
          OIDC_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          CRATES_TOKEN=$(curl -sLS 'https://crates.io/api/v1/trusted_publishing/tokens' \
            -X POST --data "{\"jwt\": \"${OIDC_TOKEN}\"}" \
            -H 'Content-Type: application/json' | jq -r '.token')
          cargo publish --token "${CRATES_TOKEN}"
