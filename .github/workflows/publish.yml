name: Publish to crates.io

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish to crates.io when true; run validation-only when false"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag (vX.Y.Z) used for stable version embedding"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io (otherwise validation-only)"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag (vX.Y.Z) used for stable version embedding"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  FLOWMARK_RELEASE_TAG: ${{ inputs.release_tag || '' }}

jobs:
  publish:
    name: Crates channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Pre-install tryscript
        run: npm install -g tryscript@0.1.7
      - name: Build flowmark binary for tests
        run: cargo build --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run tests before publishing
        run: cargo test --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Validate cargo publish payload (dry-run)
        run: cargo publish --dry-run --locked

      - name: Resolve crate metadata
        id: crate
        run: python3 ./scripts/resolve_crate_metadata.py --manifest-path Cargo.toml --github-output "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        if: inputs.publish && steps.crate.outputs.already_published != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth

      - name: Publish to crates.io
        if: inputs.publish && steps.crate.outputs.already_published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Skip publish (already exists)
        if: inputs.publish && steps.crate.outputs.already_published == 'true'
        run: echo "${{ steps.crate.outputs.crate_name }} v${{ steps.crate.outputs.crate_version }} is already published; skipping upload."
