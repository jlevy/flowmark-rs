name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Pre-install tryscript
        run: npm install -g tryscript@latest
      - uses: astral-sh/setup-uv@v7
      - name: Install Python flowmark for parity tests
        run: uv tool install flowmark==0.6.4
      - name: Build flowmark binary for tests
        run: cargo build --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run tests before publishing
        run: cargo test --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Publish to crates.io
        run: |
          # Exchange GitHub OIDC token for crates.io publish token (trusted publishing)
          OIDC_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          if [ -z "${OIDC_TOKEN}" ] || [ "${OIDC_TOKEN}" = "null" ]; then
            echo "::error::Failed to obtain OIDC token from GitHub"
            exit 1
          fi
          RESPONSE=$(curl -sLS 'https://crates.io/api/v1/trusted_publishing/tokens' \
            -X POST --data "{\"jwt\": \"${OIDC_TOKEN}\"}" \
            -H 'Content-Type: application/json')
          CRATES_TOKEN=$(echo "${RESPONSE}" | jq -r '.token')
          if [ -z "${CRATES_TOKEN}" ] || [ "${CRATES_TOKEN}" = "null" ]; then
            echo "::error::Failed to exchange OIDC token for crates.io token. Response: ${RESPONSE}"
            echo "Ensure trusted publishing is configured at https://crates.io/settings/tokens"
            exit 1
          fi
          cargo publish --token "${CRATES_TOKEN}"
