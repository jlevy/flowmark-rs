name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.5). Use dry-run for validation-only runs."
        required: true
        type: string
        default: dry-run
      publish:
        description: "Publish channels + create GitHub Release"
        required: true
        type: boolean
        default: false
      publish_prerelease:
        description: "Allow publishing prerelease tags to crates.io/PyPI"
        required: true
        type: boolean
        default: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      artifact_tag: ${{ steps.plan.outputs.artifact_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      publish_channels: ${{ steps.plan.outputs.publish_channels }}
    steps:
      - name: Resolve release mode
        id: plan
        run: |
          python3 ./scripts/resolve_release_plan.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --tag "${{ inputs.tag || '' }}" \
            --publish "${{ inputs.publish || 'false' }}" \
            --publish-prerelease "${{ inputs.publish_prerelease || 'false' }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --github-output "$GITHUB_OUTPUT"

  package:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - aarch64-pc-windows-msvc
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-musl
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            target_rustflags: ''
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            target_rustflags: ''
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            target_rustflags: '--codegen linker=aarch64-linux-gnu-gcc'
          - target: x86_64-apple-darwin
            os: macos-latest
            target_rustflags: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            target_rustflags: ''
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            target_rustflags: ''

    runs-on: ${{ matrix.os }}
    needs: [plan]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install target dependencies
        run: |
          case ${{ matrix.target }} in
            aarch64-pc-windows-msvc)
              rustup target add aarch64-pc-windows-msvc
              ;;
            aarch64-unknown-linux-musl)
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
              ;;
            x86_64-unknown-linux-musl)
              sudo apt-get update
              sudo apt-get install -y musl-tools
              ;;
          esac

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set cross-compilation CC for musl targets
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: |
          RUSTFLAGS="--deny warnings --codegen target-feature=+crt-static ${{ matrix.target_rustflags }}" \
            cargo build --bin flowmark --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          set -euxo pipefail
          VERSION=${{ needs.plan.outputs.artifact_tag }}
          BIN=flowmark
          if [[ ${{ matrix.os }} == windows-latest ]]; then
            BIN=$BIN.exe
          fi

          STAGING=flowmark-$VERSION-${{ matrix.target }}
          mkdir "$STAGING"
          cp target/${{ matrix.target }}/release/$BIN "$STAGING/"
          cp LICENSE README.md "$STAGING/"

          case ${{ matrix.os }} in
            ubuntu-latest | macos-latest)
              ARCHIVE=$STAGING.tar.gz
              tar czf "$ARCHIVE" "$STAGING"
              echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT
              ;;
            windows-latest)
              ARCHIVE=$STAGING.zip
              7z a "$ARCHIVE" "$STAGING"
              echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archives-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}

  checksum:
    runs-on: ubuntu-latest
    needs: [plan, package]

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-archives-*
          merge-multiple: true
          path: release

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 * > ../SHA256SUMS

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: SHA256SUMS

  crates:
    needs: [plan, package, checksum]
    uses: ./.github/workflows/publish.yml
    permissions:
      id-token: write
      contents: read
    with:
      publish: ${{ needs.plan.outputs.publish_channels == 'true' }}
    secrets: inherit

  pypi:
    needs: [plan, package, checksum]
    uses: ./.github/workflows/pypi.yml
    permissions:
      id-token: write
      contents: read
    with:
      publish: ${{ needs.plan.outputs.publish_channels == 'true' }}
      check_url: https://pypi.org/simple/
    secrets: inherit

  announce:
    runs-on: ubuntu-latest
    needs: [plan, checksum, crates, pypi]
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.release_tag }}"

          if [[ -z "$tag" ]]; then
            echo "Missing release tag in publish mode"
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} does not exist in repository history"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            prerelease_flag=""
            if [[ "${{ needs.plan.outputs.prerelease }}" == "true" ]]; then
              prerelease_flag="--prerelease"
            fi
            target_sha="$(git rev-list -n 1 "$tag")"
            gh release create "$tag" --target "$target_sha" $prerelease_flag --generate-notes release/*
          fi

  homebrew:
    runs-on: ubuntu-latest
    needs: [plan, checksum, crates, pypi, announce]
    if: needs.plan.outputs.publish_channels == 'true' && needs.plan.outputs.prerelease != 'true' && secrets.HOMEBREW_TAP_TOKEN != ''
    permissions:
      contents: read
    steps:
      - name: Download checksums artifact
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: release

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: jlevy/homebrew-flowmark
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula checksums
        run: |
          set -euo pipefail

          tag="${{ needs.plan.outputs.release_tag }}"
          version="${tag#v}"
          formula="homebrew-tap/Formula/flowmark.rb"
          checksums="release/SHA256SUMS"

          if [[ ! -f "$checksums" ]]; then
            echo "Missing checksum file: $checksums"
            exit 1
          fi

          declare -A shas
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl
          do
            archive="flowmark-v${version}-${target}.tar.gz"
            sha="$(awk -v archive="$archive" '$2 == archive { print $1 }' "$checksums")"
            if [[ -z "$sha" ]]; then
              echo "Missing checksum for ${archive}"
              exit 1
            fi
            shas[$target]="$sha"
          done

          sed -i.bak -E "s/version \"[^\"]+\"/version \"${version}\"/" "$formula"
          rm -f "${formula}.bak"

          tmp="$(mktemp)"
          current_target=""
          while IFS= read -r line; do
            case "$line" in
              *"flowmark-v#{version}-aarch64-apple-darwin.tar.gz"*)
                current_target="aarch64-apple-darwin"
                echo "$line" >> "$tmp"
                continue
                ;;
              *"flowmark-v#{version}-x86_64-apple-darwin.tar.gz"*)
                current_target="x86_64-apple-darwin"
                echo "$line" >> "$tmp"
                continue
                ;;
              *"flowmark-v#{version}-aarch64-unknown-linux-musl.tar.gz"*)
                current_target="aarch64-unknown-linux-musl"
                echo "$line" >> "$tmp"
                continue
                ;;
              *"flowmark-v#{version}-x86_64-unknown-linux-musl.tar.gz"*)
                current_target="x86_64-unknown-linux-musl"
                echo "$line" >> "$tmp"
                continue
                ;;
            esac

            if [[ -n "$current_target" && "$line" =~ ^[[:space:]]*sha256[[:space:]]+\"[a-f0-9]+\" ]]; then
              printf '      sha256 "%s"\n' "${shas[$current_target]}" >> "$tmp"
              current_target=""
            else
              echo "$line" >> "$tmp"
            fi
          done < "$formula"
          mv "$tmp" "$formula"

      - name: Commit and push tap update
        run: |
          set -euo pipefail
          cd homebrew-tap

          if git diff --quiet -- Formula/flowmark.rb; then
            echo "Formula already up to date"
            exit 0
          fi

          version="${{ needs.plan.outputs.release_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flowmark.rb
          git commit -m "chore: update flowmark formula to ${version}"
          git push
