name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.5). Use dry-run for validation-only runs."
        required: true
        type: string
        default: dry-run
      publish:
        description: "Publish channels + create GitHub Release"
        required: true
        type: boolean
        default: false
      publish_prerelease:
        description: "Allow publishing prerelease tags to crates.io/PyPI"
        required: true
        type: boolean
        default: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      artifact_tag: ${{ steps.plan.outputs.artifact_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      publish_channels: ${{ steps.plan.outputs.publish_channels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release mode
        id: plan
        run: python3 ./scripts/resolve_release_plan.py --event-name "${GITHUB_EVENT_NAME}" --ref-name "${GITHUB_REF_NAME}" --tag "${{ inputs.tag || '' }}" --publish "${{ inputs.publish || 'false' }}" --publish-prerelease "${{ inputs.publish_prerelease || 'false' }}" --run-id "${GITHUB_RUN_ID}" --github-output "$GITHUB_OUTPUT"

  package:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - aarch64-pc-windows-msvc
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-musl
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            target_rustflags: ''
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            target_rustflags: ''
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            target_rustflags: '--codegen linker=aarch64-linux-gnu-gcc'
          - target: x86_64-apple-darwin
            os: macos-latest
            target_rustflags: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            target_rustflags: ''
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            target_rustflags: ''

    runs-on: ${{ matrix.os }}
    needs: [plan]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux ARM64 musl dependencies
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Install Linux x86_64 musl dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set cross-compilation CC for musl targets
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        env:
          FLOWMARK_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: RUSTFLAGS="--deny warnings --codegen target-feature=+crt-static ${{ matrix.target_rustflags }}" cargo build --bin flowmark --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: python3 ./scripts/package_release_archive.py --artifact-tag "${{ needs.plan.outputs.artifact_tag }}" --target "${{ matrix.target }}" --runner-os "${{ matrix.os }}" --github-output "$GITHUB_OUTPUT"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-archives-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}

  checksum:
    runs-on: ubuntu-latest
    needs: [plan, package]

    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-archives-*
          merge-multiple: true
          path: release

      - name: Generate checksums
        run: (cd release && shasum -a 256 * > ../SHA256SUMS)

      - name: Upload checksums artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-checksums
          path: SHA256SUMS

  crates:
    needs: [plan, package, checksum]
    uses: ./.github/workflows/publish.yml
    permissions:
      id-token: write
      contents: read
    with:
      publish: ${{ needs.plan.outputs.publish_channels == 'true' }}
      release_tag: ${{ needs.plan.outputs.release_tag }}
    secrets: inherit

  pypi:
    needs: [plan, package, checksum]
    uses: ./.github/workflows/pypi.yml
    permissions:
      id-token: write
      contents: read
    with:
      publish: ${{ needs.plan.outputs.publish_channels == 'true' }}
      check_url: https://pypi.org/simple/
      release_tag: ${{ needs.plan.outputs.release_tag }}
    secrets: inherit

  announce:
    runs-on: ubuntu-latest
    needs: [plan, checksum, crates, pypi]
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
