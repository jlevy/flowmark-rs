name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FLOWMARK_DOC_FORMATTER_VERSION: "0.7.3"

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable symlink checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize complete submodules on Unix
        if: runner.os != 'Windows'
        run: git submodule update --init --recursive
      - name: Initialize exact shared test assets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $upstreamCommit = git rev-parse HEAD:repos/flowmark
          $upstreamUrl = git config -f .gitmodules --get submodule.repos/flowmark.url
          $upstreamRepository = Join-Path $env:RUNNER_TEMP "flowmark-upstream.git"
          $upstreamArchive = Join-Path $env:RUNNER_TEMP "flowmark-shared-tests.tar"
          New-Item -ItemType Directory -Force repos/flowmark | Out-Null
          git init --bare $upstreamRepository
          git -C $upstreamRepository fetch --depth=1 $upstreamUrl $upstreamCommit
          $actualCommit = git -C $upstreamRepository rev-parse FETCH_HEAD
          if ($actualCommit -ne $upstreamCommit) {
            throw "Expected Flowmark $upstreamCommit, got $actualCommit"
          }
          # Git validates the complete source tree on Windows even though this archive
          # selects only portable paths. Disable that validation for this read-only
          # archive operation; the extraction remains limited to README.md and tests/.
          git -c core.protectNTFS=false -c core.autocrlf=false -C $upstreamRepository archive --format=tar --output=$upstreamArchive FETCH_HEAD README.md tests
          tar -xf $upstreamArchive -C repos/flowmark
          if (-not (Test-Path repos/flowmark/README.md)) {
            throw "Shared README was not materialized"
          }
          if (-not (Test-Path repos/flowmark/tests/parity_corpus/manifest.toml)) {
            throw "Shared conformance manifest was not materialized"
          }
          git -C repos/flowmark init
          git -C repos/flowmark remote add origin $upstreamUrl
          git -C repos/flowmark fetch --depth=1 $upstreamRepository $upstreamCommit
          git -C repos/flowmark update-ref --no-deref HEAD $upstreamCommit
          $materializedCommit = git -C repos/flowmark rev-parse HEAD
          if ($materializedCommit -ne $upstreamCommit) {
            throw "Expected materialized Flowmark $upstreamCommit, got $materializedCommit"
          }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Pre-install tryscript
        run: npm install -g tryscript@0.1.7
      - name: Build flowmark binary for tryscript tests
        run: cargo build --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"
      - run: cargo test --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"

  test-lib-only:
    name: Test library (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --no-default-features
        env:
          RUSTFLAGS: "-D warnings"

  msrv:
    name: MSRV check (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --all-features

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@419f0f955ea0cf384c06ae25b10b8d3bcba087da # cargo-llvm-cov
      - name: Build flowmark binary for shared conformance tests
        run: cargo build --locked --all-features
        env:
          RUSTFLAGS: "-D warnings"
      - name: Run coverage (excluding tryscript golden tests that need external binary)
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info --ignore-filename-regex test_tryscript_golden -- --skip tryscript
        env:
          RUSTFLAGS: "-D warnings"
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  semver-checks:
    name: Semver compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2

  markdown-fmt:
    name: Markdown format
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Format markdown with flowmark
        run: uvx flowmark@${{ env.FLOWMARK_DOC_FORMATTER_VERSION }} --auto --extend-exclude "tests/" --extend-exclude "attic/" --extend-exclude ".claude/" --extend-exclude "python/" --extend-exclude "README.md" .
      - name: Exclude generated README from markdown drift check
        run: git checkout -- README.md
      - name: Check for formatting changes
        run: >-
          git diff --exit-code -- '*.md' || echo "::warning::Some markdown files need
          formatting. Run: uvx flowmark@${FLOWMARK_DOC_FORMATTER_VERSION} --auto --extend-exclude
          tests/ --extend-exclude attic/ --extend-exclude .claude/ --extend-exclude
          python/ --extend-exclude README.md ."

  readme-sync:
    name: README generation sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Verify Flowmark skill runtime mirror
        run: python3 scripts/sync_skill_mirror.py --check
      - name: Regenerate README
        run: ./scripts/generate_rust_readme.py
      - name: Verify README is in sync
        run: git diff --exit-code -- README.md

  workflow-scripts:
    name: Workflow script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run workflow script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  check-mapping:
    name: Test mapping check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install Python dev tools
        working-directory: python
        run: uv sync --group dev
      - name: Run smoke tests (all, including mapping completeness)
        working-directory: python
        run: uv run pytest tests/test_smoke.py -v
      - name: Check mapping completeness
        working-directory: python
        run: uv run flowmark-dev check-mapping
