name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  check-mapping:
    name: Test mapping check
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python dev tools
        working-directory: python
        run: uv sync --group dev
      - name: Run smoke tests (determinism + round-trip)
        working-directory: python
        run: uv run pytest tests/test_smoke.py -v -k "not MappingCompleteness"
      - name: Check mapping completeness (informational)
        working-directory: python
        run: uv run flowmark-dev check-mapping || true
