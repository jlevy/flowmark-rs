[advisories]
version = 2
# yaml-rust 0.4.5 is unmaintained (RUSTSEC-2024-0320) but is a transitive dep
# of comrak via syntect. No action available until comrak updates syntect.
ignore = ["RUSTSEC-2024-0320"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
