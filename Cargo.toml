[package]
name = "flowmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Joshua Levy <joshua@cal.berkeley.edu>"]
license = "MIT OR Apache-2.0"
description = "Fast, modern Markdown formatter with smart typography and paragraph wrapping"
repository = "https://github.com/jlevy/flowmark-rs"
homepage = "https://github.com/jlevy/flowmark"
readme = "README.md"
keywords = ["markdown", "formatter", "cli", "text-processing"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.python_source]
# Version of Python Flowmark this Rust version is based on
version = "0.7.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[lints.rust]
unsafe_code = "forbid"

# Binary targets (only built with cli feature)
[[bin]]
name = "flowmark"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "flowmark-rs"
path = "src/main.rs"
required-features = ["cli"]

# Library target
[lib]
name = "flowmark"
path = "src/lib.rs"

[dependencies]
# Markdown parsing
comrak = { version = "0.47", default-features = false }

# CLI framework (optional)
clap = { version = "4.5", features = ["derive", "cargo", "color"], optional = true }

# Error handling
color-eyre = { version = "0.6", optional = true }
thiserror = "2.0"

# Logging (optional)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Text processing (core)
regex = "1.10"
fancy-regex = "0.14"
once_cell = "1.19"

# Config loading
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# File operations (CLI only)
tempfile = { version = "3.10", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
insta = "1.41"

[features]
default = ["cli"]
cli = [
    "clap",
    "color-eyre",
    "tracing",
    "tracing-subscriber",
    "tempfile",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = 'abort'
