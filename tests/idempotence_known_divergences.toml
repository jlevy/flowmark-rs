# Documents that do not reach a formatting fixed point in one pass.
#
# Asserted exactly by tests/test_idempotence_corpus.rs: an unlisted failure fails the
# build, and an entry here that now passes also fails it, so this list shrinks and
# cannot rot. Every entry names the bead tracking its defect.
#
# Every entry below reproduces in the Python reference implementation as well, except
# CommonMark 0552, and every one of them also fails on the v0.3.2 release, so these are
# inherited shared-contract gaps rather than regressions from the preservation work. The
# one regression PR #81 did introduce (fmr-0pxh) is fixed and no longer listed. Per
# project convention the intended bytes are agreed and fixed upstream in Python first,
# then replicated exactly in Rust, and the entry is removed here.
#
# The reference implementation keeps the same gate and a file of the same name. It
# currently lists 90 entries to this file's 66; the difference is the Python-only
# nested-list spacing defect tracked as fm-82mg. That bead's other half — a blockquote
# holding a heading then prose — was fixed upstream in jlevy/flowmark#75 and is gone from
# both files.
#
# See docs/project/specs/active/plan-2026-08-27-idempotence-verification.md.

schema_version = 1


